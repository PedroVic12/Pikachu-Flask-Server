        /**
         * Classe BirthdayOracle
         * Responsável por todos os cálculos de tempo relacionados à data 06/12/1998.
         */
        class BirthdayOracle {
            constructor(day = 6, month = 12, year = 1998) {
                this.birthDay = day;
                this.birthMonth = month;
                this.birthYear = year;
                // Mês no JS é 0-indexado (11 = Dezembro)
                this.birthDate = new Date(year, month - 1, day, 0, 0, 0);
            }

            // Calcula quanto tempo falta para o próximo aniversário de 06/12
            getNextBirthdayCountdown() {
                const now = new Date();
                let targetYear = now.getFullYear();
                let nextBday = new Date(targetYear, this.birthMonth - 1, this.birthDay, 0, 0, 0);

                // Verifica se hoje é o dia do aniversário!
                const isBirthdayToday = (
                    now.getDate() === this.birthDay &&
                    now.getMonth() === (this.birthMonth - 1)
                );

                if (now > nextBday && !isBirthdayToday) {
                    targetYear += 1;
                    nextBday = new Date(targetYear, this.birthMonth - 1, this.birthDay, 0, 0, 0);
                }

                const diff = Math.max(0, nextBday - now);
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                return {
                    days: String(days).padStart(2, '0'),
                    hours: String(hours).padStart(2, '0'),
                    minutes: String(minutes).padStart(2, '0'),
                    seconds: String(seconds).padStart(2, '0'),
                    upcomingAge: targetYear - this.birthYear,
                    isBirthdayToday
                };
            }

            // Calcula há exatos quantos dias, horas, minutos e segundos ela ilumina o mundo desde 06/12/1998
            getLifeTimeStats() {
                const now = new Date();
                const diff = Math.max(0, now - this.birthDate);

                const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                // Cálculo preciso da idade atual
                let currentAge = now.getFullYear() - this.birthYear;
                const m = now.getMonth() - (this.birthMonth - 1);
                if (m < 0 || (m === 0 && now.getDate() < this.birthDay)) {
                    currentAge--;
                }

                return {
                    currentAge,
                    totalDays: totalDays.toLocaleString('pt-BR'),
                    hours: String(hours).padStart(2, '0'),
                    minutes: String(minutes).padStart(2, '0'),
                    seconds: String(seconds).padStart(2, '0')
                };
            }
        }

        /**
         * Classe RomanticUniverse3D
         * Gerencia toda a cena 3D em Three.js usando Orientação a Objetos.
         */
        class RomanticUniverse3D {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas || !window.THREE) return;

                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.z = 35;

                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    alpha: true,
                    antialias: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                this.mouseX = 0;
                this.mouseY = 0;
                this.scrollY = 0;
                this.hearts = [];

                this.initLights();
                this.createStarfield();
                this.createFloating3DHearts();
                this.bindEvents();
                this.animate();
            }

            initLights() {
                const ambientLight = new THREE.AmbientLight(0xffb3c6, 0.7);
                this.scene.add(ambientLight);

                const pointLight1 = new THREE.PointLight(0xff1e42, 2.5, 100);
                pointLight1.position.set(15, 20, 20);
                this.scene.add(pointLight1);

                const pointLight2 = new THREE.PointLight(0x9333ea, 2, 100);
                pointLight2.position.set(-20, -15, 15);
                this.scene.add(pointLight2);
            }

            createStarfield() {
                const geometry = new THREE.BufferGeometry();
                const count = 900;
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);

                const palette = [
                    new THREE.Color('#ff1e42'), // Vermelho Metálico
                    new THREE.Color('#ec4899'), // Rosa
                    new THREE.Color('#a855f7'), // Roxo
                    new THREE.Color('#38bdf8')  // Brilho Azul Celeste
                ];

                for (let i = 0; i < count * 3; i += 3) {
                    positions[i] = (Math.random() - 0.5) * 120;
                    positions[i + 1] = (Math.random() - 0.5) * 140;
                    positions[i + 2] = (Math.random() - 0.5) * 80;

                    const randomColor = palette[Math.floor(Math.random() * palette.length)];
                    colors[i] = randomColor.r;
                    colors[i + 1] = randomColor.g;
                    colors[i + 2] = randomColor.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                const material = new THREE.PointsMaterial({
                    size: 0.45,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.85
                });

                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
            }

            createFloating3DHearts() {
                // Desenhando uma geometria de coração em 3D
                const x = 0, y = 0;
                const heartShape = new THREE.Shape();
                heartShape.moveTo(x + 0.5, y + 0.5);
                heartShape.bezierCurveTo(x + 0.5, y + 0.5, x + 0.4, y, x, y);
                heartShape.bezierCurveTo(x - 0.6, y, x - 0.6, y + 0.7, x - 0.6, y + 0.7);
                heartShape.bezierCurveTo(x - 0.6, y + 1.1, x - 0.3, y + 1.54, x + 0.5, y + 1.9);
                heartShape.bezierCurveTo(x + 1.2, y + 1.54, x + 1.6, y + 1.1, x + 1.6, y + 0.7);
                heartShape.bezierCurveTo(x + 1.6, y + 0.7, x + 1.6, y, x + 1.0, y);
                heartShape.bezierCurveTo(x + 0.7, y, x + 0.5, y + 0.5, x + 0.5, y + 0.5);

                const extrudeSettings = {
                    depth: 0.3,
                    bevelEnabled: true,
                    bevelSegments: 3,
                    steps: 1,
                    bevelSize: 0.15,
                    bevelThickness: 0.15
                };

                const geometry = new THREE.ExtrudeGeometry(heartShape, extrudeSettings);
                geometry.center();

                // Material Vermelho Metálico 3D
                const metallicMaterial = new THREE.MeshStandardMaterial({
                    color: 0xd90429,
                    metalness: 0.75,
                    roughness: 0.2,
                    emissive: 0x3a0007
                });

                for (let i = 0; i < 14; i++) {
                    const mesh = new THREE.Mesh(geometry, metallicMaterial);
                    mesh.position.set(
                        (Math.random() - 0.5) * 55,
                        (Math.random() - 0.5) * 65,
                        (Math.random() - 0.5) * 25 - 5
                    );
                    mesh.rotation.z = Math.PI; // Corrige orientação do coração
                    mesh.rotation.x = Math.random() * Math.PI;
                    mesh.rotation.y = Math.random() * Math.PI;

                    const scale = Math.random() * 0.65 + 0.35;
                    mesh.scale.set(scale, scale, scale);

                    this.hearts.push({
                        mesh,
                        rotSpeedX: (Math.random() - 0.5) * 0.015,
                        rotSpeedY: (Math.random() - 0.5) * 0.02,
                        floatSpeed: Math.random() * 0.015 + 0.005,
                        offset: Math.random() * Math.PI * 2
                    });

                    this.scene.add(mesh);
                }
            }

            bindEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('mousemove', (e) => {
                    this.mouseX = (e.clientX / window.innerWidth - 0.5) * 4;
                    this.mouseY = (e.clientY / window.innerHeight - 0.5) * 4;
                });

                window.addEventListener('touchmove', (e) => {
                    if (e.touches.length > 0) {
                        this.mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 4;
                        this.mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 4;
                    }
                });

                window.addEventListener('scroll', () => {
                    this.scrollY = window.scrollY;
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                const time = performance.now() * 0.001;

                if (this.particles) {
                    this.particles.rotation.y = time * 0.04 + this.scrollY * 0.0003;
                    this.particles.rotation.x = this.scrollY * 0.0002;
                }

                this.hearts.forEach((h) => {
                    h.mesh.rotation.y += h.rotSpeedY;
                    h.mesh.rotation.x += h.rotSpeedX;
                    h.mesh.position.y += Math.sin(time * 2 + h.offset) * 0.015;
                });

                // Suavização de câmera com Parallax de mouse e scroll
                this.camera.position.x += (this.mouseX - this.camera.position.x) * 0.05;
                this.camera.position.y += (-this.mouseY - (this.scrollY * 0.006) - this.camera.position.y) * 0.05;
                this.camera.lookAt(0, -(this.scrollY * 0.006), 0);

                this.renderer.render(this.scene, this.camera);
            }
        }

        // ==========================================
        // 3. COMPONENTE TIMELINE CARD COM PARALLAX & REVELAÇÃO
        // ==========================================
        const TimelineCard = ({ item, index, scrollY, customImage, nextPhotoName, onUploadPhoto }) => {
            const [revealed, setRevealed] = useState(false);

            const [isVisible, setIsVisible] = useState(false);

            // IntersectionObserver para revelação suave ao rolar a tela
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.18 }
                );
                if (cardRef.current) observer.observe(cardRef.current);
                return () => observer.disconnect();
            }, []);

            // Cálculo de deslocamento Parallax suave para as imagens 4:3
            const parallaxOffset = Math.max(-35, Math.min(35, (scrollY - (index * 450)) * item.parallaxFactor));

                    ref={cardRef}

                                {/*  <p className="text-pink-100/90 text-sm sm:text-lg max-w-xl mx-auto mb-8 leading-relaxed">
                                    Depois de comemorarmos você, que tal ficarmos bem agarradinhos no sofá ou na cama assistindo uma série juntos? Escolha o nosso combo perfeito abaixo:
                                </p> */}

                                {/* Seletores Interativos do Date */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left mb-6">
                                    {/* Escolha do Estilo da Série */}
                                    <div className="navy-card p-5 rounded-2xl">
                                        <label className="block text-xs font-bold uppercase tracking-wider text-pink-300 mb-3">
                                            1. Qual vibe de série você quer ver hoje? 📺
                                        </label>
                                        <div className="grid grid-cols-1 gap-2">
                                            {[
                                                'Romance & Drama 🥰',
                                                'Videos do Jovem Nerd para rirmos muito 😂',
                                                'Nossa série favorita de sempre 💖'
                                            ].map((genre) => (
                                                <button
                                                    key={genre}
                                                    type="button"
                                                    onClick={() => setSelectedGenre(genre)}
                                                    className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-left transition-all flex items-center justify-between ${selectedGenre === genre
                                                        ? 'metallic-red-bg text-white font-semibold'
                                                        : 'bg-navy-950/70 text-slate-300 hover:bg-navy-800'
                                                        }`}
                                                >
                                                    <span>{genre}</span>
                                                    {selectedGenre === genre && <span>✓</span>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Escolha do Lanche e Nome da Série */}
                                    <div className="navy-card p-5 rounded-2xl flex flex-col justify-between">
                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-pink-300 mb-3">
                                                2. O que não pode faltar no nosso date? 🍫
                                            </label>
                                            <div className="grid grid-cols-1 gap-2 mb-4">
                                                {[
                                                    'Pipoca + Chocolate 🍿🍫',
                                                    'Pizza + Refrigerante 🍕🥤',
                                                    'Docinhos + Cobertor Quentinho 🍓🧸'
                                                ].map((snack) => (
                                                    <button
                                                        key={snack}
                                                        type="button"
                                                        onClick={() => setSelectedSnack(snack)}
                                                        className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-medium text-left transition-all flex items-center justify-between ${selectedSnack === snack
                                                            ? 'bg-gradient-to-r from-pink-600 to-purple-600 text-white font-semibold'
                                                            : 'bg-navy-950/70 text-slate-300 hover:bg-navy-800'
                                                            }`}
                                                    >
                                                        <span>{snack}</span>
                                                        {selectedSnack === snack && <span>✓</span>}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold uppercase tracking-wider text-pink-300 mb-1.5">
                                                Tem alguma série específica em mente? (Opcional)
                                            </label>
                                            <input
                                                type="text"
                                                value={customSerieName}
                                                onChange={(e) => setCustomSerieName(e.target.value)}
                                                placeholder="Ex: Bridgerton, Friends, Dorama..."
                                                className="w-full px-4 py-2.5 rounded-xl bg-navy-950/90 border border-pink-500/40 text-white placeholder-slate-400 text-sm focus:outline-none focus:border-pink-400"
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* Botões de Ação e Link Direto */}
                                <div className="flex flex-col sm:flex-row items-center justify-center gap-4 mt-8">
                                    <a
                                        href={getWhatsAppInviteLink()}
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        onClick={() => {
                                            setInviteAccepted(true);
                                            triggerRomanticExplosion();
                                        }}
                                        className="w-full sm:w-auto px-8 py-4 rounded-2xl metallic-red-bg text-white font-bold text-base sm:text-lg shadow-2xl hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2"
                                    >
                                        {/*                                         <img src="./vision-quest.jpeg" alt=""> </img>
 */}
                                        <span>💌 Aceitar Convite & Me Chamar para Ver a Série!</span>
                                    </a>

                                    <button
                                        type="button"
                                        onClick={() => {
                                            setInviteAccepted(true);
                                            triggerRomanticExplosion();
                                        }}
                                        className="w-full sm:w-auto px-6 py-4 rounded-2xl bg-navy-900/90 hover:bg-navy-800 border border-pink-400/40 text-pink-200 font-semibold text-sm sm:text-base transition-all"
                                    >
                                        ✨ Celebrar na Tela!
                                    </button>
                                </div>

                                {/* Confirmação Fofa caso ela clique */}
                                {inviteAccepted && (
                                    <div className="mt-6 p-4 rounded-2xl bg-navy-950/90 border border-pink-500/50 text-pink-200 text-sm sm:text-base animate-pulse">
                                        🥰 <strong>Encontro Confirmado!</strong> Prepare o coração (e o cobertor) porque a nossa sessão de{' '}
                                        <span className="text-white font-bold">{customSerieName || selectedGenre}</span> com{' '}
                                        <span className="text-white font-bold">{selectedSnack}</span> vai ser inesquecível! Te amo! ❤️
                                    </div>
                                )}
                            </div>
                        </div>
                    </section>

                    {/* RODAPÉ ROMÂNTICO */}
                    <footer className="text-center py-6 px-4 text-xs sm:text-sm text-slate-400">
                        <p>
                            Feito com todo o amor do mundo especialmente para você ❤️ • <span className="text-pink-400 font-semibold">06/12/1998</span>
                        </p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
