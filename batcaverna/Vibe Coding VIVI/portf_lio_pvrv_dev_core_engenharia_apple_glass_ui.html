        /**
         * Classe SymPyLatexEngine
         * Converte expressões Python SymPy em código LaTeX puro e renderiza via KaTeX.
         */
        class SymPyLatexEngine {
            constructor() {
                this.symbolMap = [
                    { regex: /Integral\(([^,]+),\s*\(([^,]+),\s*([^,]+),\s*([^)]+)\)\)/g, replace: '\\int_{$3}^{$4} $1 \\, d$2' },
                    { regex: /Integral\(([^,]+),\s*([^)]+)\)/g, replace: '\\int $1 \\, d$2' },
                    { regex: /Derivative\(([^,]+),\s*([^,]+),\s*2\)/g, replace: '\\frac{\\partial^2 $1}{\\partial $2^2}' },
                    { regex: /Derivative\(([^,]+),\s*([^)]+)\)/g, replace: '\\frac{d $1}{d $2}' },
                    { regex: /Sum\(([^,]+),\s*\(([^,]+),\s*([^,]+),\s*([^)]+)\)\)/g, replace: '\\sum_{$2=$3}^{$4} $1' },
                    { regex: /Eq\(([^,]+),\s*([^)]+)\)/g, replace: '$1 = $2' },
                    { regex: /sqrt\(([^)]+)\)/g, replace: '\\sqrt{$1}' },
                    { regex: /exp\(([^)]+)\)/g, replace: 'e^{$1}' },
                    { regex: /\boo\b/g, replace: '\\infty' },
                    { regex: /\bpi\b/g, replace: '\\pi' },
                    { regex: /\balpha\b/g, replace: '\\alpha' },
                    { regex: /\bbeta\b/g, replace: '\\beta' },
                    { regex: /\bgamma\b/g, replace: '\\gamma' },
                    { regex: /\bdelta\b/g, replace: '\\delta' },
                    { regex: /\bDelta\b/g, replace: '\\Delta' },
                    { regex: /\btheta\b/g, replace: '\\theta' },
                    { regex: /\blambda\b/g, replace: '\\lambda' },
                    { regex: /\bomega\b/g, replace: '\\omega' },
                    { regex: /\bOmega\b/g, replace: '\\Omega' },
                    { regex: /\bsigma\b/g, replace: '\\sigma' },
                    { regex: /\bPhi\b/g, replace: '\\Phi' },
                    { regex: /\bPsi\b/g, replace: '\\Psi' },
                    { regex: /\bmu_0\b/g, replace: '\\mu_0' },
                    { regex: /\bepsilon_0\b/g, replace: '\\varepsilon_0' },
                    { regex: /\bhbar\b/g, replace: '\\hbar' },
                    { regex: /\bNabla\b/g, replace: '\\nabla' },
                    { regex: /\bsin\(/g, replace: '\\sin(' },
                    { regex: /\bcos\(/g, replace: '\\cos(' },
                    { regex: /\*\*([a-zA-Z0-9_+-]+)/g, replace: '^{$1}' },
                    { regex: /\*/g, replace: ' \\cdot ' }
                ];
            }

            // Converte string SymPy para LaTeX se não houver override manual
            toLatex(sympyExpr, presetLatex = null) {
                if (presetLatex) return presetLatex;
                let latex = sympyExpr.trim();
                this.symbolMap.forEach(rule => {
                    latex = latex.replace(rule.regex, rule.replace);
                });
                return latex;
            }
        }

        /**
         * Classe AcademicPredictor2027
         * Calcula em tempo real o progresso desde 2022.2 até a formatura prevista em 2027.2 (UFF).
         */
        class AcademicPredictor2027 {
            constructor() {
                // Agosto de 2022 (2022.2) até Dezembro de 2027 (2027.2) -> 11 semestres (5.5 anos)
                this.entryDate = new Date(2022, 7, 15, 8, 0, 0); // 15/08/2022
                this.graduationDate = new Date(2027, 11, 15, 20, 0, 0); // 15/12/2027
            }

            getCountdownToGraduation() {
                const now = new Date();
                const totalDuration = this.graduationDate - this.entryDate;
                const elapsed = now - this.entryDate;
                const remaining = Math.max(0, this.graduationDate - now);

                const percentage = Math.min(100, Math.max(0, (elapsed / totalDuration) * 100)).toFixed(2);

                const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
                const hours = Math.floor((remaining / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((remaining / 1000 / 60) % 60);
                const seconds = Math.floor((remaining / 1000) % 60);

                return {
                    days: String(days).padStart(3, '0'),
                    hours: String(hours).padStart(2, '0'),
                    minutes: String(minutes).padStart(2, '0'),
                    seconds: String(seconds).padStart(2, '0'),
                    percentage
                };
            }

            // Calcula a previsão de CR, carga horária e índice de domínio técnico até 2027.2
            predictGraduationMetrics(semestersList) {
                let totalSubjects = 0;
                let completedSubjects = 0;
                let weightedGradeSum = 0;
                let gradedCount = 0;

                semestersList.forEach(sem => {
                    sem.subjects.forEach(sub => {
                        totalSubjects++;
                        if (sub.status === 'CONCLUÍDO') {
                            completedSubjects++;
                        }
                        if (sub.grade) {
                            weightedGradeSum += Number(sub.grade);
                            gradedCount++;
                        }
                    });
                });

                const currentCR = gradedCount > 0 ? (weightedGradeSum / gradedCount) : 8.4;
                // Modelo de regressão/tendência para 2027.2 considerando estágio ONS + iniciação científica
                const predictedCR2027 = Math.min(9.8, (currentCR * 0.75 + 2.25)).toFixed(2);
                const completionRate = totalSubjects > 0 ? Math.round((completedSubjects / totalSubjects) * 100) : 0;

                return {
                    totalSubjects,
                    completedSubjects,
                    completionRate,
                    currentCR: currentCR.toFixed(2),
                    predictedCR2027,
                    estimatedHours: totalSubjects * 68
                };
            }
        }

        /**
         * Classe CyberGridUniverse3D
         * Motor Three.js POO que desenha nós de sistemas elétricos de potência (SEP) e partículas quânticas.
         */
        class CyberGridUniverse3D {
            constructor(canvasId) {
                this.canvas = document.getElementById(canvasId);
                if (!this.canvas || !window.THREE) return;

                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.z = 40;

                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    alpha: true,
                    antialias: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

                this.mouseX = 0;
                this.mouseY = 0;
                this.scrollY = 0;
                this.polyhedrons = [];

                this.initLights();
                this.createDataField();
                this.createMathPolyhedrons();
                this.bindEvents();
                this.animate();
            }

            initLights() {
                const ambient = new THREE.AmbientLight(0x38bdf8, 0.8);
                this.scene.add(ambient);

                const p1 = new THREE.PointLight(0x38bdf8, 2.5, 120);
                p1.position.set(20, 25, 25);
                this.scene.add(p1);

                const p2 = new THREE.PointLight(0xa855f7, 2.2, 120);
                p2.position.set(-25, -20, 15);
                this.scene.add(p2);
            }

            createDataField() {
                const geom = new THREE.BufferGeometry();
                const count = 850;
                const pos = new Float32Array(count * 3);
                const col = new Float32Array(count * 3);

                const palette = [
                    new THREE.Color('#38bdf8'), // Cyan SEP
                    new THREE.Color('#10b981'), // Emerald Tricolor
                    new THREE.Color('#a855f7'), // Julia Purple
                    new THREE.Color('#f59e0b')  // ONS Solar Gold
                ];

                for (let i = 0; i < count * 3; i += 3) {
                    pos[i] = (Math.random() - 0.5) * 140;
                    pos[i + 1] = (Math.random() - 0.5) * 160;
                    pos[i + 2] = (Math.random() - 0.5) * 90;

                    const c = palette[Math.floor(Math.random() * palette.length)];
                    col[i] = c.r;
                    col[i + 1] = c.g;
                    col[i + 2] = c.b;
                }

                geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                geom.setAttribute('color', new THREE.BufferAttribute(col, 3));

                const mat = new THREE.PointsMaterial({
                    size: 0.45,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.75
                });

                this.particles = new THREE.Points(geom, mat);
                this.scene.add(this.particles);
            }

            createMathPolyhedrons() {
                const geom = new THREE.IcosahedronGeometry(1.6, 0);
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x38bdf8,
                    wireframe: true,
                    metalness: 0.8,
                    roughness: 0.2
                });

                for (let i = 0; i < 12; i++) {
                    const mesh = new THREE.Mesh(geom, mat);
                    mesh.position.set(
                        (Math.random() - 0.5) * 65,
                        (Math.random() - 0.5) * 75,
                        (Math.random() - 0.5) * 30 - 8
                    );
                    const scale = Math.random() * 0.9 + 0.4;
                    mesh.scale.set(scale, scale, scale);

                    this.polyhedrons.push({
                        mesh,
                        rx: (Math.random() - 0.5) * 0.015,
                        ry: (Math.random() - 0.5) * 0.018,
                        offset: Math.random() * Math.PI * 2
                    });

                    this.scene.add(mesh);
                }
            }

            bindEvents() {
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });

                window.addEventListener('mousemove', (e) => {
                    this.mouseX = (e.clientX / window.innerWidth - 0.5) * 5;
                    this.mouseY = (e.clientY / window.innerHeight - 0.5) * 5;
                });

                window.addEventListener('scroll', () => {
                    this.scrollY = window.scrollY;
                }, { passive: true });
            }

            animate() {
                requestAnimationFrame(() => this.animate());
                const t = performance.now() * 0.001;

                if (this.particles) {
                    this.particles.rotation.y = t * 0.03 + this.scrollY * 0.0002;
                    this.particles.rotation.x = this.scrollY * 0.00015;
                }

                this.polyhedrons.forEach(p => {
                    p.mesh.rotation.x += p.rx;
                    p.mesh.rotation.y += p.ry;
                    p.mesh.position.y += Math.sin(t * 1.5 + p.offset) * 0.012;
                });

                this.camera.position.x += (this.mouseX - this.camera.position.x) * 0.05;
                this.camera.position.y += (-this.mouseY - (this.scrollY * 0.004) - this.camera.position.y) * 0.05;
                this.camera.lookAt(0, -(this.scrollY * 0.004), 0);

                this.renderer.render(this.scene, this.camera);
            }
        }

                            displayMode,

                        containerRef.current.textContent = finalLatex;

            const size = 320;
            const center = size / 2;
            const radius = 105;

            const getCoordinates = (angleIndex, value) => {
                const angle = (Math.PI * 2 * angleIndex) / axes.length - Math.PI / 2;
                const r = (value / 100) * radius;
                return {
                    x: center + r * Math.cos(angle),
                    y: center + r * Math.sin(angle)
                };
            };

            return (
                <div
                    className="w-full max-w-md mx-auto my-4 p-4 rounded-3xl apple-glass flex flex-col items-center justify-center"

                            const points = axes.map((_, i) => {
                                const { x, y } = getCoordinates(i, level);
                                return `${x},${y}`;
                            }).join(' ');
                            return (
                                <polygon
                                    key={level}
                                    points={points}
                                    fill="none"
                                    stroke="rgba(255,255,255,0.15)"
                                    strokeDasharray={level === 100 ? "none" : "3,3"}
                                    strokeWidth="1"
                                />
                            );
                        })}

                        {/* Eixos e Rótulos */}
                        {axes.map((axis, i) => {
                            const end = getCoordinates(i, 100);
                            const labelPos = getCoordinates(i, 124);
                            return (
                                <g key={axis.key}>
                                    <line
                                        x1={center}
                                        y1={center}
                                        x2={end.x}
                                        y2={end.y}
                                        stroke="rgba(255,255,255,0.2)"

                                    />

                                        dominantBaseline="middle"

                                        fontSize="11"

                                    >

                                    </text>
                                </g>
                            );

                            }).join(' ');

                                    <polygon

                                        fill={tech.bgColor}
                                        stroke={tech.color}
                                        strokeWidth="2.5"
                                    />
                                    {axes.map((axis, i) => {

                                </g>

                                    { id: 'BRASIL_GOV', label: '🇧🇷 Fases do Governo Brasileiro (1500–1889)' },
                                    { id: 'CIENCIA', label: '⚛️ Equações da Ciência' },
                                    { id: 'PESSOAL', label: '🎓 Meu Nascimento & Ingresso UFF (2022.2)' }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setTimelineFilter(tab.id)}
                                        className={`px-4 py-2 rounded-2xl text-xs sm:text-sm font-semibold transition-all ${timelineFilter === tab.id
                                                ? 'bg-cyan-500 text-black font-bold shadow-lg shadow-cyan-500/30'
                                                : 'apple-glass text-slate-300 hover:text-white'
                                            }`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            {/* Cards da Linha do Tempo com Parallax 4:3 */}
                            <div className="relative space-y-12 before:hidden md:before:block before:absolute before:left-1/2 before:top-4 before:bottom-4 before:-translate-x-1/2 before:w-0.5 before:bg-gradient-to-b before:from-cyan-500 before:via-purple-500 before:to-emerald-500">
                                {filteredTimeline.map((item, index) => {
                                    const isEven = index % 2 === 0;
                                    const isRevealed = !!revealedSecrets[item.id];

                                    return (
                                        <div
                                            key={item.id}
                                            className={`relative flex flex-col md:flex-row items-center gap-6 md:gap-12 ${isEven ? 'md:flex-row' : 'md:flex-row-reverse'
                                                }`}
                                        >
                                            {/* Nó Central Desktop */}
                                            <div className="hidden md:flex absolute left-1/2 -translate-x-1/2 w-11 h-11 rounded-full apple-glass items-center justify-center z-20 border-2 border-cyan-400 text-base">
                                                {item.icon.slice(0, 2)}
                                            </div>

                                            {/* Coluna 1: Quadro 4:3 Parallax com SymPy + LaTeX */}
                                            <div className="w-full md:w-1/2">
                                                <Frame4x3AppleGlass item={item} scrollY={scrollY} index={index} />
                                            </div>

                                            {/* Coluna 2: Descrição Histórica/Científica e Revelação JS */}
                                            <div className="w-full md:w-1/2">
                                                <div className="apple-glass rounded-3xl p-6 sm:p-7">
                                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
                                                        <span className="px-3 py-1 rounded-full text-xs font-mono font-semibold bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">
                                                            {item.badge}
                                                        </span>
                                                        <span className="text-xs font-mono text-slate-400">{item.year}</span>
                                                    </div>

                                                    <h3 className="text-xl sm:text-2xl font-bold text-white mb-2">
                                                        {item.title}
                                                    </h3>

                                                    <p className="text-xs sm:text-sm text-slate-300 leading-relaxed mb-4">
                                                        {item.description}
                                                    </p>

                                                    <button
                                                        onClick={() => toggleTimelineSecret(item.id)}
                                                        className="w-full py-2.5 px-4 rounded-xl bg-white/10 hover:bg-cyan-500/25 border border-white/15 text-xs font-mono font-semibold text-cyan-200 transition flex items-center justify-between"
                                                    >
                                                        <span>{isRevealed ? '🔓 Ocultar Conexão Engenharia & História' : '💡 Revelar Insight Histórico / Científico'}</span>
                                                        <span>{isRevealed ? '▲' : '▼'}</span>
                                                    </button>

                                                    {isRevealed && (
                                                        <div className="mt-3 p-3.5 rounded-xl bg-black/50 border border-cyan-500/30 text-xs text-emerald-200 leading-relaxed">
                                                            {item.secretNote}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </section>

                        {/* 3. SIMULADOR & PLANEJADOR DE MATÉRIAS E EQUAÇÕES (2022.2 ATÉ 2027.2) */}
                        <section id="grade-uff" className="apple-glass rounded-[2.2rem] p-6 sm:p-10 space-y-8">
                            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-white/10 pb-6">
                                <div>
                                    <span className="px-3 py-1 rounded-full bg-emerald-500/15 border border-emerald-400/30 text-emerald-300 text-xs font-mono">
                                        PLANEJADOR INTERATIVO UFF • 2022.2 ATÉ 2027.2
                                    </span>
                                    <h2 className="text-2xl sm:text-3xl font-extrabold section-title mt-2">
                                        Mapa de Matérias & Equações SymPy até a Formatura (2027.2)
                                    </h2>
                                    <p className="text-xs sm:text-sm text-slate-300 mt-1">
                                        Navegue pelos 11 semestres (de 2022.2 a 2027.2), altere o status das matérias clicando nelas e cadastre novas disciplinas e equações em SymPy!
                                    </p>
                                </div>
                            </div>

                            {/* Seletor de Semestres em Pílulas iOS */}
                            <div className="flex items-center gap-2 overflow-x-auto pb-2">
                                {semestersData.map(sem => {
                                    const active = selectedSemesterTab === sem.semester;
                                    return (
                                        <button
                                            key={sem.semester}
                                            onClick={() => setSelectedSemesterTab(sem.semester)}
                                            className={`px-4 py-2.5 rounded-2xl font-mono text-xs font-bold whitespace-nowrap transition-all ${active
                                                    ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-black shadow-lg scale-105'
                                                    : 'bg-black/45 text-slate-300 hover:bg-white/10 border border-white/10'
                                                }`}
                                        >
                                            <span>{sem.semester}</span>
                                            <span className="ml-1.5 text-[10px] opacity-75">({sem.subjects.length})</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Lista de Matérias e Equações do Semestre Selecionado */}
                            {semestersData.filter(s => s.semester === selectedSemesterTab).map(currentSem => (
                                <div key={currentSem.semester} className="space-y-4">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-black/40 p-4 rounded-2xl border border-white/10">
                                        <div>
                                            <h3 className="text-lg font-bold text-white">
                                                Semestre {currentSem.semester}: <span className="text-cyan-400">{currentSem.periodTitle}</span>
                                            </h3>
                                            <p className="text-xs text-slate-400">
                                                Clique no selo de status de qualquer disciplina abaixo para alternar entre CONCLUÍDO, EM ANDAMENTO e PREVISTO.
                                            </p>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {currentSem.subjects.map(sub => (
                                            <div key={sub.id} className="apple-glass rounded-2xl p-5 flex flex-col justify-between border border-white/15 hover:border-cyan-400/50 transition">
                                                <div>
                                                    <div className="flex items-start justify-between gap-2 mb-3">
                                                        <h4 className="font-bold text-sm sm:text-base text-white">{sub.name}</h4>
                                                        <button
                                                            onClick={() => toggleSubjectStatus(currentSem.semester, sub.id)}
                                                            className={`px-2.5 py-1 rounded-full text-[10px] font-mono font-bold shrink-0 ${sub.status === 'CONCLUÍDO'
                                                                    ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                                                                    : sub.status === 'EM ANDAMENTO'
                                                                        ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40'
                                                                        : 'bg-purple-500/20 text-purple-300 border border-purple-500/40'
                                                                }`}
                                                        >
                                                            {sub.status} ↻
                                                        </button>
                                                    </div>

                                                    {/* Renderização LaTeX da Equação Principal da Matéria */}
                                                    <div className="bg-black/50 rounded-xl p-3 border border-white/10 my-2">
                                                        <LatexRenderer sympyExpr={sub.sympy} latexOverride={sub.latex} />
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between text-[11px] font-mono text-slate-400 pt-2 border-t border-white/10 mt-2">
                                                    <span className="truncate max-w-[70%] text-cyan-300">🐍 {sub.sympy}</span>
                                                    <span className="text-emerald-400 font-bold">Nota/Meta: {sub.grade}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ))}

                            {/* Formulário para Adicionar Nova Matéria e Equação SymPy até 2027.2 */}
                            <form onSubmit={handleAddSubjectEquation} className="bg-black/50 rounded-3xl p-5 sm:p-6 border border-cyan-500/30 space-y-4">
                                <h4 className="text-sm sm:text-base font-bold text-cyan-300 flex items-center gap-2">
                                    <span>➕</span> Adicionar Nova Matéria & Equação SymPy ao Planejamento (2022.2 – 2027.2)
                                </h4>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
                                    <div>
                                        <label className="block text-[11px] font-mono text-slate-400 mb-1">Semestre</label>
                                        <select
                                            value={newSubjectSemester}
                                            onChange={(e) => setNewSubjectSemester(e.target.value)}
                                            className="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-white/15 text-xs text-white"
                                        >
                                            {semestersData.map(s => (
                                                <option key={s.semester} value={s.semester}>{s.semester}</option>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="sm:col-span-2">
                                        <label className="block text-[11px] font-mono text-slate-400 mb-1">Nome da Disciplina (UFF / Optativa)</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: Subestações e Equipamentos Elétricos"
                                            value={newSubjectName}
                                            onChange={(e) => setNewSubjectName(e.target.value)}
                                            className="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-white/15 text-xs text-white"
                                        />
                                    </div>

                                    <div className="sm:col-span-2">
                                        <label className="block text-[11px] font-mono text-slate-400 mb-1">Equação em SymPy</label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="Ex: Eq(P_loss, 3 * R * I**2)"
                                            value={newSubjectSympy}
                                            onChange={(e) => setNewSubjectSympy(e.target.value)}
                                            className="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-cyan-500/40 font-mono text-xs text-emerald-300"
                                        />
                                    </div>
                                </div>

                                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
                                    <div className="flex items-center gap-3 w-full sm:w-auto">
                                        <div>
                                            <label className="block text-[10px] font-mono text-slate-400">Status</label>
                                            <select
                                                value={newSubjectStatus}
                                                onChange={(e) => setNewSubjectStatus(e.target.value)}
                                                className="px-3 py-1.5 rounded-lg bg-slate-900 border border-white/15 text-xs text-white"
                                            >
                                                <option value="PREVISTO">PREVISTO</option>
                                                <option value="EM ANDAMENTO">EM ANDAMENTO</option>
                                                <option value="CONCLUÍDO">CONCLUÍDO</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-mono text-slate-400">Nota / Meta</label>
                                            <input
                                                type="number"
                                                step="0.1"
                                                min="0"
                                                max="10"
                                                value={newSubjectGrade}
                                                onChange={(e) => setNewSubjectGrade(e.target.value)}
                                                className="w-20 px-3 py-1.5 rounded-lg bg-slate-900 border border-white/15 text-xs text-white"
                                            />
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        className="w-full sm:w-auto px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-emerald-400 text-black font-bold text-xs shadow-lg hover:scale-105 transition"
                                    >
                                        ➕ Converter SymPy & Salvar no Semestre {newSubjectSemester}
                                    </button>
                                </div>
                            </form>
                        </section>

                        {/* 4. GERENCIADOR DEV-OPS LOCALHOST & ECOSSISTEMA PVRV (DO SEU CÓDIGO) */}
                        <section id="devops-stack" className="space-y-12">

                            {/* DevOps Localhosts */}
                            <div className="apple-glass rounded-[2.2rem] p-6 sm:p-8">
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-2">
                                    <h2 className="text-xl sm:text-2xl font-extrabold section-title flex items-center gap-2">
                                        <span>🌐</span> GERENCIADOR DEV-OPS & URLS ATIVAS
                                    </h2>
                                    <span className="px-3 py-1 rounded-full text-xs font-mono font-bold bg-cyan-950 text-cyan-400 border border-cyan-800">
                                        LOCAL HOSTS • PVRV CORE
                                    </span>
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    {[
                                        { id: 1, name: 'BatCaverna / Next.js Kanban Pro', url: 'http://localhost:3000', env: 'DEV', stack: 'Next.js 16 / React / Turbopack', db: 'kanban.xlsx + LocalStorage', status: 'Online (HTTP 200)' },
                                        { id: 2, name: 'Pikachu Flask Backend Server', url: 'http://localhost:5000', env: 'DEV', stack: 'Python / Flask / REST API', db: 'sqlite / PostgreSQL', status: 'Standby' },
                                        { id: 3, name: 'FastAPI Microservice SEP', url: 'http://localhost:8000', env: 'STABLE', stack: 'Python / FastAPI / Pydantic', db: 'batcaverna.sqlite', status: 'Online' },
                                        { id: 4, name: 'Streamlit IA & Data App', url: 'http://localhost:8501', env: 'STABLE', stack: 'Streamlit / Pandas / Plotly', db: 'data.sqlite', status: 'Online' }
                                    ].map(p => (
                                        <div key={p.id} className="bg-black/45 p-5 rounded-2xl border border-white/10 hover:border-cyan-400/50 transition">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="text-sm sm:text-base font-bold text-cyan-400">{p.name}</h3>
                                                <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold ${p.env === 'DEV' ? 'bg-yellow-500/20 text-yellow-300 border border-yellow-500/40' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'}`}>
                                                    {p.env}
                                                </span>
                                            </div>
                                            <div className="space-y-1 text-xs font-mono text-slate-300">
                                                <div>🔗 <strong>URL:</strong> <a href={p.url} target="_blank" rel="noreferrer" className="text-cyan-400 underline">{p.url}</a></div>
                                                <div>⚡ <strong>Stack:</strong> {p.stack}</div>
                                                <div>💾 <strong>Banco:</strong> {p.db}</div>
                                                <div>📡 <strong>Status:</strong> <span className="text-emerald-400 font-bold">{p.status}</span></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Stack de Tecnologias & Radar 3D */}
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="lg:col-span-2 apple-glass rounded-[2.2rem] p-6 sm:p-8">
                                    <h2 className="text-xl sm:text-2xl font-extrabold section-title text-center mb-2">
                                        ⚡ STACK DE TECNOLOGIAS & RADAR 3D
                                    </h2>
                                    <p className="text-xs text-center text-slate-300 mb-5">
                                        Toque nas linguagens abaixo para comparar performance em Backend, Sistemas Embarcados, Desktop e Simulação SEP:
                                    </p>

                                    <div className="flex flex-wrap justify-center gap-2 mb-4">
                                        {Object.keys(techStackData).map(key => {
                                            const tech = techStackData[key];
                                            const isActive = selectedTechs.includes(key);
                                            return (
                                                <button
                                                    key={key}
                                                    onClick={() => handleSelectTech(key)}
                                                    className={`font-semibold text-xs py-2 px-3.5 rounded-xl border transition-all ${isActive ? 'scale-105 shadow-lg font-bold' : 'opacity-65 hover:opacity-100'
                                                        }`}
                                                    style={{
                                                        backgroundColor: isActive ? tech.color : 'rgba(0,0,0,0.4)',
                                                        borderColor: tech.color,
                                                        color: isActive ? '#000' : '#fff'
                                                    }}
                                                >
                                                    {tech.name}
                                                </button>
                                            );
                                        })}
                                    </div>

                                    <CustomRadarChart3D selectedTechs={selectedTechs} />
                                </div>

                                {/* Detalhes da Última Tecnologia Selecionada */}
                                <div className="apple-glass rounded-[2.2rem] p-6 sm:p-8 flex flex-col justify-between">
                                    {selectedTechs.length > 0 ? (() => {
                                        const activeKey = selectedTechs[selectedTechs.length - 1];
                                        const tech = techStackData[activeKey];
                                        return (
                                            <div>
                                                <div className="flex justify-between items-start mb-4">
                                                    <h3 className="text-xl font-bold" style={{ color: tech.color }}>{tech.name}</h3>
                                                    <span className="px-2.5 py-1 rounded-full text-xs font-mono bg-white/10 text-cyan-300">{tech.difficulty}</span>
                                                </div>
                                                <div
                                                    className="text-xs sm:text-sm leading-relaxed text-slate-200 space-y-2 mb-6"
                                                    dangerouslySetInnerHTML={{ __html: tech.description }}
                                                />
                                                <div className="space-y-2.5 pt-4 border-t border-white/10 text-xs font-mono">
                                                    {Object.entries(tech.scores).map(([metric, val]) => (
                                                        <div key={metric}>
                                                            <div className="flex justify-between mb-1">
                                                                <span className="capitalize text-slate-300">{metric}</span>
                                                                <span style={{ color: tech.color }}>{val}%</span>
                                                            </div>
                                                            <div className="w-full h-2 rounded-full bg-black/50 overflow-hidden">
                                                                <div className="h-full rounded-full" style={{ width: `${val}%`, backgroundColor: tech.color }} />
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        );
                                    })() : (
                                        <p className="text-xs text-slate-400">Selecione ao menos uma tecnologia ao lado para inspecionar os indicadores.</p>
                                    )}
                                </div>
                            </div>
                        </section>

                        {/* 5. MEU ROTEIRO PESSOAL & TAREFAS (ONS, UFF, GITHUB) */}
                        <section id="roteiro" className="apple-glass rounded-[2.2rem] p-6 sm:p-10">
                            <h2 className="text-xl sm:text-2xl font-extrabold section-title text-center mb-2">
                                📋 MEU ROTEIRO PESSOAL & TAREFAS (ONS • UFF • GITHUB)
                            </h2>
                            <p className="text-xs sm:text-sm text-center text-slate-300 mb-8 max-w-2xl mx-auto">
                                Controle interativo de atividades do estágio no ONS, disciplinas práticas da Engenharia Elétrica UFF e repositórios GitHub.
                            </p>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {Object.entries(roteiro).map(([category, data]) => (
                                    <div key={category} className="bg-black/45 p-5 rounded-2xl border border-white/10 flex flex-col justify-between">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="font-bold text-sm sm:text-base text-cyan-400">{category}</h3>
                                            <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-cyan-950 text-cyan-300 border border-cyan-800">
                                                {data.status}
                                            </span>
                                        </div>
                                        <ul className="space-y-2.5">
                                            {data.tasks.map(t => (
                                                <li
                                                    key={t.id}
                                                    onClick={() => handleToggleTask(category, t.id)}
                                                    className="flex items-center gap-3 text-xs sm:text-sm cursor-pointer p-2 rounded-xl hover:bg-white/5 transition"
                                                >
                                                    <input
                                                        type="checkbox"
                                                        checked={t.completed}
                                                        onChange={() => { }}
                                                        className="w-4 h-4 rounded accent-cyan-400 cursor-pointer"
                                                    />
                                                    <span className={t.completed ? 'line-through opacity-45' : 'text-slate-200'}>
                                                        {t.text}
                                                    </span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        </section>

                    </main>

                    {/* DOCK FLUTUANTE INFERIOR MOBILE-FIRST ESTILO iOS / macOS */}
                    <div className="fixed bottom-4 inset-x-0 z-50 flex justify-center px-4 pointer-events-none">
                        <div className="apple-glass-pill rounded-full px-4 py-2 flex items-center gap-3 sm:gap-5 pointer-events-auto shadow-2xl">
                            <a href="#previsao-2027" className="text-xs font-mono text-slate-200 hover:text-cyan-400 flex items-center gap-1">
                                <span>🎓</span> <span className="hidden sm:inline">2027.2</span>
                            </a>
                            <span className="text-white/20">|</span>
                            <a href="#timeline-sympy" className="text-xs font-mono text-slate-200 hover:text-cyan-400 flex items-center gap-1">
                                <span>📜</span> <span className="hidden sm:inline">1500–1889 & Ciência</span>
                            </a>
                            <span className="text-white/20">|</span>
                            <a href="#grade-uff" className="text-xs font-mono text-slate-200 hover:text-cyan-400 flex items-center gap-1">
                                <span>🧮</span> <span className="hidden sm:inline">SymPy UFF</span>
                            </a>
                            <span className="text-white/20">|</span>
                            <a href="#devops-stack" className="text-xs font-mono text-slate-200 hover:text-cyan-400 flex items-center gap-1">
                                <span>⚡</span> <span className="hidden sm:inline">DevOps & Radar</span>
                            </a>
                        </div>
                    </div>

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
