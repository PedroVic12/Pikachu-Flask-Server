<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <!-- Meta viewport essencial para Mobile First e responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sistema Integrado - Planner & Blog</title>

    <!-- Tailwind CSS para Layout Responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel para compilar JSX no navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Material UI -->
    <script src="https://unpkg.com/@mui/material@5.14.5/umd/material-ui.production.min.js"></script>

    <!-- Marked.js para compilar Markdown (Checklists e Blog) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Fonts & Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Segoe+UI:wght@400;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Personalizado Base -->
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Evita scroll duplo no desktop, o React gerencia o scroll interno */
            height: 100vh;
            width: 100vw;
            background-color: #1f1f1f;
            /* Fundo escuro base */
        }

        #root {
            height: 100%;
            width: 100%;
        }

        /* Scrollbar customizada (discreta) */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #888;
        }

        /* Estilização para Checklists em Markdown (Workspace) */
        .markdown-checklist {
            color: #e2e8f0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .markdown-checklist h1,
        .markdown-checklist h2,
        .markdown-checklist h3 {
            font-weight: bold;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: #fff;
        }

        .markdown-checklist p {
            margin-bottom: 0.5rem;
        }

        .markdown-checklist ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .markdown-checklist .checklist {
            list-style-type: none;
            padding-left: 0;
        }

        .markdown-checklist .checklist li {
            display: flex;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .markdown-checklist input[type="checkbox"] {
            margin-right: 10px;
            margin-top: 4px;
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        /* Edição de Textarea Transparente */
        .markdown-editor {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            color: #e2e8f0;
            font-family: monospace;
            resize: none;
            outline: none;
            padding: 1rem;
        }

        /* Estilização para Markdown do Blog (Estilo Claro/Artigo) */
        .blog-markdown {
            font-family: 'Georgia', serif;
        }

        .blog-markdown h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: #111;
            font-family: 'Inter', sans-serif;
            line-height: 1.2;
        }

        .blog-markdown h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
            color: #222;
            font-family: 'Inter', sans-serif;
        }

        .blog-markdown p {
            margin-bottom: 1.2rem;
            line-height: 1.8;
            color: #333;
            text-align: justify;
            font-size: 1.05rem;
        }

        .blog-markdown strong {
            font-weight: 700;
            color: #000;
        }

        .blog-markdown ul {
            list-style-type: disc;
            padding-left: 2rem;
            margin-bottom: 1.5rem;
            color: #333;
            line-height: 1.8;
        }

        /* Helpers Visuais Drag and Drop */
        .drag-over {
            background-color: rgba(59, 130, 246, 0.15) !important;
            border: 2px dashed #3b82f6 !important;
        }

        /* Estilo do Card Post-it para SWOT e Kanban */
        .post-it {
            background: linear-gradient(135deg, #fef08a 0%, #fde047 100%);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            color: #1f2937;
            border-bottom-right-radius: 12px 2px;
            border-bottom-left-radius: 2px;
            position: relative;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            cursor: grab;
            user-select: none;
            /* Evita selecionar texto ao arrastar */
        }

        .post-it:active {
            cursor: grabbing;
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        /* Dobra no canto inferior direito do post-it */
        .post-it::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            border-width: 8px 8px 0 0;
            border-style: solid;
            border-color: #eab308 transparent transparent transparent;
            box-shadow: -1px -1px 2px rgba(0, 0, 0, 0.1);
        }

        /* Classes utilitárias estilo Flutter (Flex) */
        .flutter-column {
            display: flex;
            flex-direction: column;
        }

        .flutter-row {
            display: flex;
            flex-direction: row;
        }

        .flutter-expanded {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 0;
        }

        /* Menu lateral Mobile Offcanvas */
        .mobile-drawer {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 40;
            transform: translateX(-100%);
            transition: transform 0.3s ease-in-out;
        }

        .mobile-drawer.open {
            transform: translateX(0);
        }

        .drawer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 30;
            display: none;
        }

        .drawer-overlay.open {
            display: block;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;
        const { ThemeProvider, createTheme, CssBaseline, Button, IconButton, TextField, Avatar, Tabs, Tab, Typography, Tooltip } = MaterialUI;

        // ==========================================
        // 1. ARQUITETURA MVC - MODEL E STORAGE
        // ==========================================

        class LocalDatabaseMyWebsite {
            constructor(hashKey = 'sys_web_planner_v1') {
                this.hashKey = hashKey;
            }
            saveData(data) {
                try { localStorage.setItem(this.hashKey, JSON.stringify(data)); }
                catch (e) { console.error("Erro ao salvar no LocalStorage:", e); }
            }
            loadData(defaultData) {
                try {
                    const item = localStorage.getItem(this.hashKey);
                    return item ? JSON.parse(item) : defaultData;
                } catch (e) { return defaultData; }
            }
            clear() { localStorage.removeItem(this.hashKey); }
        }

        // Lista de projetos baseada na imagem solicitada
        const projectsList = [
            { id: 'p1', name: 'Atualização SIGER SE/CO - PLC', icon: 'update' },
            { id: 'p2', name: 'Novatos PLC', icon: 'school' },
            { id: 'p3', name: 'Montadores Mensal PLC', icon: 'handyman' },
            { id: 'p4', name: 'Áreas - SECO', icon: 'map' },
            { id: 'p5', name: 'Suporte SAPECP - Mensal', icon: 'support_agent' },
            { id: 'p6', name: 'Alexandre Rodrigues Nunes', icon: 'person' },
            { id: 'p7', name: 'Marcos Jorge Araujo de Souza', icon: 'person' },
            { id: 'p8', name: 'Reunião PLC', icon: 'groups' }
        ];

        // Estado inicial complexo agrupado por projeto
        const initialAppState = {
            currentRoute: 'workspace', // 'workspace' ou 'blog'
            activeProjectId: 'p3', // Montadores Mensal PLC selecionado por padrão
            plannerTab: 0, // 0 = Kanban, 1 = SWOT
            isMobileDrawerOpen: false, // Controle de menu no celular

            // Dados específicos por projeto (Dicionário: ProjectID -> { markdown, tasks })
            projectData: {
                'p3': {
                    markdown: "### Reunião de Montadores Mensal\n\n**Pautas Principais:**\n- [x] Revisar metas do mês passado\n- [ ] Distribuir novas planilhas de despacho\n- [ ] Verificar EPIs\n\n**Observações:**\nLembrar de cobrar o relatório do SAPECP ao Bruno.",
                    tasks: [
                        { id: 't1', text: 'Revisar Barramentos 3º Quad.', swot: 'weaknesses', kanban: 'todo' },
                        { id: 't2', text: 'Atualizar Planilha Despacho', swot: 'strengths', kanban: 'doing' },
                        { id: 't3', text: 'Treinamento Novos Montadores', swot: 'opportunities', kanban: 'done' },
                        { id: 't4', text: 'Problema no SAPECP', swot: 'threats', kanban: 'todo' }
                    ]
                },
                'p1': {
                    markdown: "### Atualização SIGER\n- [ ] Validar MT\n- [ ] Validar AC\n- [ ] Validar RO\n\n*Status atual:* Suzana reportou OK parcial.",
                    tasks: [
                        { id: 't5', text: 'Validar dados MT', swot: 'strengths', kanban: 'doing' }
                    ]
                }
                // Outros projetos iniciam vazios dinamicamente se não existirem
            }
        };

        class AppModel {
            constructor() {
                this.db = new LocalDatabaseMyWebsite();
                // Carrega do banco ou usa default
                const savedState = this.db.loadData(initialAppState);

                // Garante que projetos novos na lista tenham estrutura de dados básica
                projectsList.forEach(p => {
                    if (!savedState.projectData[p.id]) {
                        savedState.projectData[p.id] = { markdown: `# ${p.name}\n- [ ] Nova tarefa`, tasks: [] };
                    }
                });

                this.state = savedState;
                this.listeners = [];

                // Interceptador para persistência automática
                const originalSetState = this.setState.bind(this);
                this.setState = (newState) => {
                    originalSetState(newState);
                    this.db.saveData(this.state);
                };
            }
            subscribe(listener) {
                this.listeners.push(listener);
                return () => { this.listeners = this.listeners.filter(l => l !== listener); };
            }
            setState(newState) {
                this.state = { ...this.state, ...newState };
                this.listeners.forEach(l => l(this.state));
            }
            getState() { return this.state; }
        }

        class AppController {
            constructor(model) { this.model = model; }

            // Navegação e UI
            changeRoute(route) { this.model.setState({ currentRoute: route }); }
            setActiveProject(projectId) {
                this.model.setState({ activeProjectId: projectId, isMobileDrawerOpen: false });
            }
            setPlannerTab(tabIndex) { this.model.setState({ plannerTab: tabIndex }); }
            toggleMobileDrawer() {
                this.model.setState({ isMobileDrawerOpen: !this.model.getState().isMobileDrawerOpen });
            }

            // Manipulação de Markdown do Projeto Atual
            updateProjectMarkdown(newMarkdown) {
                const state = this.model.getState();
                const updatedData = { ...state.projectData };
                updatedData[state.activeProjectId] = {
                    ...updatedData[state.activeProjectId],
                    markdown: newMarkdown
                };
                this.model.setState({ projectData: updatedData });
            }

            // Lógica Unificada de Tasks (Kanban + SWOT) para o Projeto Atual
            addTask(text) {
                if (!text.trim()) return;
                const state = this.model.getState();
                const pId = state.activeProjectId;
                const newTask = { id: 't' + Date.now(), text, swot: 'opportunities', kanban: 'todo' };

                const updatedData = { ...state.projectData };
                updatedData[pId].tasks = [...updatedData[pId].tasks, newTask];
                this.model.setState({ projectData: updatedData });
            }

            updateTaskStatus(taskId, newStatus, isSwotUpdate = false) {
                const state = this.model.getState();
                const pId = state.activeProjectId;

                const updatedTasks = state.projectData[pId].tasks.map(t => {
                    if (t.id === taskId) {
                        return isSwotUpdate ? { ...t, swot: newStatus } : { ...t, kanban: newStatus };
                    }
                    return t;
                });

                const updatedData = { ...state.projectData };
                updatedData[pId].tasks = updatedTasks;
                this.model.setState({ projectData: updatedData });
            }

            deleteTask(taskId) {
                const state = this.model.getState();
                const pId = state.activeProjectId;

                const updatedTasks = state.projectData[pId].tasks.filter(t => t.id !== taskId);
                const updatedData = { ...state.projectData };
                updatedData[pId].tasks = updatedTasks;
                this.model.setState({ projectData: updatedData });
            }
        }

        // ==========================================
        // 2. COMPONENTES UTILITÁRIOS (Helpers)
        // ==========================================

        const Column = ({ children, className = '', style = {}, ...props }) => (
            <div className={`flutter-column ${className}`} style={style} {...props}>{children}</div>
        );

        const Row = ({ children, className = '', style = {}, ...props }) => (
            <div className={`flutter-row ${className}`} style={style} {...props}>{children}</div>
        );

        const Expanded = ({ children, className = '', style = {}, ...props }) => (
            <div className={`flutter-expanded ${className}`} style={style} {...props}>{children}</div>
        );

        // ==========================================
        // 3. COMPONENTES WORKSPACE & PLANNER
        // ==========================================

        const ProjectSidebar = ({ state, controller }) => (
            <Column className="h-full bg-[#1e1e1e] border-r border-[#333] w-[280px] md:w-[320px] flex-shrink-0">
                <div className="p-4 pb-2">
                    <Typography variant="h6" className="font-semibold text-lg text-white mb-2">Projetos & Áreas</Typography>
                    <Row className="gap-2 text-xs border-b border-[#333] pb-3">
                        <span className="bg-[#5c2d91] text-white px-3 py-1 rounded-full cursor-pointer hover:bg-[#6c3b9f] transition">PLC</span>
                        <span className="bg-[#3b3a39] text-gray-300 px-3 py-1 rounded-full cursor-pointer hover:bg-[#4b4a49] transition">SECO</span>
                    </Row>
                </div>

                <Expanded className="overflow-y-auto custom-scrollbar pt-2 px-2">
                    {projectsList.map(proj => (
                        <Row
                            key={proj.id}
                            onClick={() => controller.setActiveProject(proj.id)}
                            className={`
                                p-3 mb-1 rounded-md cursor-pointer items-center transition-colors
                                ${state.activeProjectId === proj.id
                                    ? 'bg-[#333] border-l-4 border-[#7b83eb] text-white shadow-sm'
                                    : 'border-l-4 border-transparent text-gray-400 hover:bg-[#2a2a2a] hover:text-gray-200'}
                            `}
                        >
                            <span className="material-icons text-sm mr-3 opacity-80">{proj.icon}</span>
                            <span className="font-medium text-sm truncate flex-1">{proj.name}</span>
                        </Row>
                    ))}
                </Expanded>
            </Column>
        );

        const ChecklistArea = ({ markdown, controller }) => {
            const [isEditing, setIsEditing] = useState(false);
            const [localText, setLocalText] = useState(markdown);

            // Sincroniza estado local se o prop mudar externo (ex: troca de projeto)
            useEffect(() => { setLocalText(markdown); setIsEditing(false); }, [markdown]);

            // Parser customizado de Markdown para Checklists do HTML
            const renderMarkdown = () => {
                let html = marked.parse(localText || '');
                // Substitui [ ] e [x] por inputs nativos do HTML mantendo o visual
                html = html.replace(/<ul>\n<li>\[ \]/g, '<ul class="checklist">\n<li><input type="checkbox" onclick="return false;" />');
                html = html.replace(/<ul>\n<li>\[x\]/g, '<ul class="checklist">\n<li><input type="checkbox" checked onclick="return false;" />');
                html = html.replace(/<li>\[ \]/g, '<li><input type="checkbox" onclick="return false;" />');
                html = html.replace(/<li>\[x\]/g, '<li><input type="checkbox" checked onclick="return false;" />');
                return { __html: html };
            };

            const handleSave = () => {
                controller.updateProjectMarkdown(localText);
                setIsEditing(false);
            };

            return (
                <Column className="h-full bg-[#252423] border-r border-[#333] flex-1 min-w-[300px]">
                    <Row className="p-3 border-b border-[#333] justify-between items-center bg-[#1a1a1a]">
                        <Typography variant="subtitle2" className="text-gray-300 font-semibold flex items-center gap-2">
                            <span className="material-icons text-[18px] text-blue-400">checklist</span>
                            Anotações do Projeto
                        </Typography>
                        {isEditing ? (
                            <Row className="gap-2">
                                <Button size="small" variant="text" color="inherit" onClick={() => { setLocalText(markdown); setIsEditing(false); }}>Cancelar</Button>
                                <Button size="small" variant="contained" color="primary" onClick={handleSave}>Salvar</Button>
                            </Row>
                        ) : (
                            <IconButton size="small" sx={{ color: '#9ca3af' }} onClick={() => setIsEditing(true)}>
                                <span className="material-icons text-[18px]">edit</span>
                            </IconButton>
                        )}
                    </Row>

                    <Expanded className="relative overflow-hidden">
                        {isEditing ? (
                            <textarea
                                className="markdown-editor custom-scrollbar"
                                value={localText}
                                onChange={(e) => setLocalText(e.target.value)}
                                placeholder="Digite aqui usando Markdown. Use - [ ] para checklists..."
                            />
                        ) : (
                            <div
                                className="h-full overflow-y-auto custom-scrollbar p-4 markdown-checklist"
                                dangerouslySetInnerHTML={renderMarkdown()}
                            />
                        )}
                    </Expanded>
                </Column>
            );
        };

        const PlannerBoard = ({ tasks, controller, tab }) => {
            const [newTaskText, setNewTaskText] = useState('');

            // Funções Drag & Drop p/ HTML5 nativo (Funciona bem em Desktop, em Mobile geralmente exige Polyfill, 
            // mas usaremos a abordagem de clique longo/arraste nativa onde suportado).
            const handleDragStart = (e, taskId) => { e.dataTransfer.setData('taskId', taskId); };
            const handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('drag-over'); };
            const handleDragLeave = (e) => { e.currentTarget.classList.remove('drag-over'); };

            const handleDrop = (e, newStatus, isSwot) => {
                e.preventDefault();
                e.currentTarget.classList.remove('drag-over');
                const taskId = e.dataTransfer.getData('taskId');
                if (taskId) controller.updateTaskStatus(taskId, newStatus, isSwot);
            };

            const TaskCard = ({ task }) => (
                <div
                    draggable="true"
                    onDragStart={(e) => handleDragStart(e, task.id)}
                    className="post-it p-3 mb-3 text-sm flex flex-col gap-2 group w-full"
                >
                    <div className="flex justify-between items-start">
                        <span className="leading-snug flex-1 pr-4">{task.text}</span>
                        <IconButton
                            size="small"
                            className="opacity-0 group-hover:opacity-100 absolute top-1 right-1"
                            sx={{ padding: '2px', color: '#ef4444' }}
                            onClick={() => controller.deleteTask(task.id)}
                        >
                            <span className="material-icons text-[16px]">delete</span>
                        </IconButton>
                    </div>
                    {/* Tags indicativas de estado cruzado */}
                    <div className="flex gap-1 mt-auto text-[10px] font-bold uppercase tracking-wider opacity-60">
                        {tab === 0
                            ? <span className="bg-black/10 px-1.5 py-0.5 rounded">{task.swot.substring(0, 3)}</span> // Mostra sigla swot no Kanban
                            : <span className="bg-black/10 px-1.5 py-0.5 rounded">{task.kanban}</span> // Mostra sigla kanban na SWOT
                        }
                    </div>
                </div>
            );

            return (
                <Column className="h-full bg-[#18181b] text-white flex-1 min-w-[300px]">
                    {/* Barra Superior do Planner */}
                    <Row className="p-2 px-4 border-b border-[#333] justify-between items-center bg-[#1a1a1a]">
                        <Tabs
                            value={tab}
                            onChange={(e, val) => controller.setPlannerTab(val)}
                            textColor="inherit"
                            indicatorColor="primary"
                            sx={{ minHeight: '40px' }}
                        >
                            <Tab label="Kanban" sx={{ minHeight: '40px', py: 0, textTransform: 'none', fontWeight: 600 }} />
                            <Tab label="SWOT" sx={{ minHeight: '40px', py: 0, textTransform: 'none', fontWeight: 600 }} />
                        </Tabs>
                    </Row>

                    {/* Input Rápido */}
                    <div className="p-3 bg-[#1e1e1e] border-b border-[#333]">
                        <form onSubmit={(e) => { e.preventDefault(); controller.addTask(newTaskText); setNewTaskText(''); }} className="flex gap-2">
                            <input
                                type="text"
                                className="flex-1 bg-[#2d2d2d] border border-[#444] rounded p-2 text-sm text-white outline-none focus:border-blue-500 transition"
                                placeholder="Criar nova nota/tarefa (arrastável)..."
                                value={newTaskText}
                                onChange={(e) => setNewTaskText(e.target.value)}
                            />
                            <button type="submit" className="bg-blue-600 px-4 rounded text-sm font-medium hover:bg-blue-500 transition whitespace-nowrap shadow">
                                + Adicionar
                            </button>
                        </form>
                    </div>

                    {/* Áreas de Renderização Baseada na Tab */}
                    <Expanded className="p-3 overflow-hidden">
                        {tab === 0 ? (
                            /* KANBAN (3 Colunas) */
                            <Row className="h-full gap-3 overflow-x-auto custom-scrollbar pb-2">
                                {[{ id: 'todo', label: 'A Fazer (To Do)', color: 'gray' },
                                { id: 'doing', label: 'Em Andamento', color: 'blue' },
                                { id: 'done', label: 'Concluído', color: 'green' }].map(col => (
                                    <Column
                                        key={col.id}
                                        className="flex-1 min-w-[200px] max-w-[400px] bg-[#222222] rounded-lg border border-[#333] shadow-inner"
                                        onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={(e) => handleDrop(e, col.id, false)}
                                    >
                                        <div className="p-3 border-b border-[#333] bg-[#2a2a2a] rounded-t-lg">
                                            <span className={`text-xs font-bold uppercase tracking-wider text-${col.color}-400`}>{col.label}</span>
                                            <span className="ml-2 text-xs text-gray-500 bg-[#1a1a1a] px-2 py-0.5 rounded-full">
                                                {tasks.filter(t => t.kanban === col.id).length}
                                            </span>
                                        </div>
                                        <div className="flex-1 overflow-y-auto custom-scrollbar p-2 flex flex-col items-center">
                                            {tasks.filter(t => t.kanban === col.id).map(t => <TaskCard key={t.id} task={t} />)}
                                        </div>
                                    </Column>
                                ))}
                            </Row>
                        ) : (
                            /* MATRIZ SWOT (Grade 2x2) */
                            <div className="h-full w-full grid grid-cols-2 grid-rows-2 gap-3 pb-2">
                                {[{ id: 'strengths', label: 'Forças (S)', color: 'text-green-400', bg: 'bg-green-900/10 border-green-900/30' },

# Introdução à Física Estatística – Salinas

<div style="display: flex; gap: 8px; margin-bottom: 24px;">
    <span style="border: 1px solid #fbd38d; color: #dd6b20; padding: 2px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; font-family: sans-serif; text-transform: uppercase;">Estatística</span>
    <span style="border: 1px solid #fbd38d; color: #dd6b20; padding: 2px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; font-family: sans-serif; text-transform: uppercase;">Física</span>
</div>

*Introdução à Física Estatística*, do professor **Silvio R. A. Salinas**, é uma obra de referência fundamental e elegante, concebida para servir como um **curso introdutório e intermediário** para estudantes de **graduação e pós-graduação em Física** e áreas correlatas da ciência. Publicada pela Edusp, o livro é reconhecido por sua **clareza expositiva, rigor conceitual e abordagem moderna**, que equilibra a dedução matemática cuidadosa com uma discussão física profunda dos fenômenos estatísticos.

Ele é amplamente adotado nas principais universidades brasileiras e tornou-se um clássico incontestável em língua portuguesa na área de termodinâmica e estatística.

## A Construção Lógica da Teoria

O livro não é apenas uma apresentação de fórmulas soltas, mas uma construção lógica da teoria termodinâmica a partir de bases microscópicas. Ele começa com os postulados fundamentais da **Mecânica Estatística**, introduzindo com grande didática os conceitos de:

*   **Espaço de fases** e a dinâmica Hamiltoniana.
*   **Ensemble microcanônico** (sistemas isolados).
*   A profunda definição estatística de **entropia de Boltzmann** ($S = k_B \ln \Omega$).

Desse ponto de partida sólido e geral, Salinas deduz de forma natural a distribuição de probabilidade para um sistema em contato com um reservatório térmico, chegando ao poderoso **ensemble canônico**. O tratamento do **ensemble grande-canônico** (onde há troca de partículas) segue a mesma lógica dedutiva, completando o arcabouço teórico principal para sistemas em equilíbrio termodinâmico.

Esta abordagem permite que o leitor construa a intuição física ao mesmo tempo em que desenvolve o ferramental matemático necessário para resolver problemas complexos da física da matéria condensada e astrofísica.
