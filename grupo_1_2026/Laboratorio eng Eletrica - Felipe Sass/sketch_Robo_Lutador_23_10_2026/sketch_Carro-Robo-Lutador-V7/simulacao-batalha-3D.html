<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulador 3D Robô Sumô - Three.js + Arduino Serial</title>
    <style>
        body { margin: 0; overflow: hidden; background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        #hud {
            position: absolute; top: 16px; left: 16px; width: 340px;
            background: rgba(15, 23, 42, 0.88); border: 1px solid #334155;
            border-left: 4px solid #38bdf8; border-radius: 10px; padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); z-index: 10;
        }
        h2 { margin: 0 0 10px 0; font-size: 1.1rem; color: #38bdf8; }
        .btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        button {
            background: #1e293b; color: #f8fafc; border: 1px solid #475569;
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600;
            transition: all 0.15s;
        }
        button:hover { background: #38bdf8; color: #0f172a; }
        button.primary { background: #0284c7; border-color: #38bdf8; width: 100%; margin-bottom: 10px; }
        .stat { font-size: 0.85rem; margin: 4px 0; color: #cbd5e1; }
        .stat span { color: #facc15; font-weight: bold; font-family: monospace; }
        .hint { font-size: 0.75rem; color: #94a3b8; margin-top: 8px; border-top: 1px solid #334155; padding-top: 8px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
    <h2>⚡ Simulador 3D Sumô (HIL)</h2>
    <button id="btnConnect" class="primary">🔌 Conectar Arduino Uno (USB)</button>
    
    <div class="btn-group">
        <button onclick="enviarComando('7')">Estrat. 7 (Agressivo)</button>
        <button onclick="enviarComando('8')">Estrat. 8 (Horário)</button>
        <button onclick="enviarComando('9')">Estrat. 9 (Anti-Hor.)</button>
    </div>
    <div class="btn-group">
        <button onclick="enviarComando('2')" style="border-color:#22c55e; color:#4ade80;">▶ Iniciar (2)</button>
        <button onclick="enviarComando('1')" style="border-color:#eab308; color:#facc15;">⏸ Pausar (1)</button>
        <button onclick="resetarPosicao()">🔄 Centralizar Robô</button>
    </div>

    <div class="stat">Status Serial: <span id="stSerial">Desconectado (Modo Demo)</span></div>
    <div class="stat">Ação do Arduino: <span id="stAcao">AGUARDANDO</span></div>
    <div class="stat">Motores (Esq / Dir): <span id="stPwm">0 / 0</span></div>
    <div class="stat">Sensores (F / E / D): <span id="stSensores">999 / 999 / 999 cm</span></div>

    <div class="hint">
        🎮 <b>Setas do Teclado (↑ ↓ ← →):</b> Movem o Robô Inimigo Vermelho pela arena para testar a perseguição do Arduino em tempo real!
    </div>
</div>

<script>
// ============================================================================
// 1. CONFIGURAÇÃO DA CENA 3D (THREE.JS)
// ============================================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1120);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 130, 140);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// Iluminação
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(50, 120, 80);
scene.add(dirLight);

// Arena Dohyo (Raio total = 77cm, Borda branca a partir de 72cm)
const RAIO_ARENA = 75;
const RAIO_BORDA_BRANCA = 70;

const geoTatame = new THREE.CylinderGeometry(RAIO_BORDA_BRANCA, RAIO_BORDA_BRANCA, 2, 64);
const matTatame = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
const tatame = new THREE.Mesh(geoTatame, matTatame);
tatame.position.y = -1;
scene.add(tatame);

const geoBorda = new THREE.RingGeometry(RAIO_BORDA_BRANCA, RAIO_ARENA, 64);
const matBorda = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
const bordaBranca = new THREE.Mesh(geoBorda, matBorda);
bordaBranca.rotation.x = -Math.PI / 2;
bordaBranca.position.y = 0.05;
scene.add(bordaBranca);

// Robô do Usuário (Azul/Ciano)
const roboGrupo = new THREE.Group();
const corpoRobo = new THREE.Mesh(
    new THREE.BoxGeometry(16, 8, 18),
    new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.3 })
);
corpoRobo.position.y = 4;
roboGrupo.add(corpoRobo);

// Rampa frontal (pá de ataque)
const rampa = new THREE.Mesh(
    new THREE.BoxGeometry(16, 2, 4),
    new THREE.MeshStandardMaterial({ color: 0xfacc15 })
);
rampa.position.set(0, 1.5, -10);
roboGrupo.add(rampa);

// Feixes visuais dos 3 sensores (Frontal 40cm, Laser Esq 25cm, Laser Dir 25cm)
function criarLinhaSensor(comprimento, anguloY, cor) {
    const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 4, -9),
        new THREE.Vector3(-Math.sin(anguloY) * comprimento, 4, -9 - Math.cos(anguloY) * comprimento)
    ]);
    return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: cor }));
}
const feixeFrontal = criarLinhaSensor(40, 0, 0x22c55e);
const feixeEsq = criarLinhaSensor(25, Math.PI / 5, 0x38bdf8);
const feixeDir = criarLinhaSensor(25, -Math.PI / 5, 0x38bdf8);
roboGrupo.add(feixeFrontal, feixeEsq, feixeDir);
scene.add(roboGrupo);

// Robô Inimigo (Vermelho - Controlável pelas setas)
const inimigo = new THREE.Mesh(
    new THREE.CylinderGeometry(9, 9, 9, 24),
    new THREE.MeshStandardMaterial({ color: 0xef4444 })
);
inimigo.position.set(0, 4.5, -42);
scene.add(inimigo);

// ============================================================================
// 2. COMUNICAÇÃO WEB SERIAL COM O ARDUINO UNO
// ============================================================================
let port, writer, reader;
let pwmEsq = 0, pwmDir = 0;
let acaoArduino = "PARADO";

document.getElementById('btnConnect').addEventListener('click', async () => {
    if (!("serial" in navigator)) {
        alert("Use um navegador baseado em Chromium (Brave, Chrome, Edge) para acessar a porta USB via Web Serial API!");
        return;
    }
    try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        document.getElementById('stSerial').innerText = "Conectado em 9600 baud!";
        document.getElementById('stSerial').style.color = "#4ade80";

        const encoder = new TextEncoderStream();
        encoder.readable.pipeTo(port.writable);
        writer = encoder.writable.getWriter();

        lerLoopSerial();
    } catch (e) {
        console.error(e);
    }
});

async function enviarComando(texto) {
    if (writer) {
        await writer.write(texto + "\n");
    }
}

async function lerLoopSerial() {
    const decoder = new TextDecoderStream();
    port.readable.pipeTo(decoder.writable);
    reader = decoder.readable.getReader();
    let buffer = "";

    while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let linhas = buffer.split("\n");
        buffer = linhas.pop();

        for (let l of linhas) {
            l = l.trim();
            if (l.startsWith("TELEM:")) {
                const partes = l.substring(6).split(",");
                if (partes.length >= 6) {
                    pwmEsq = parseInt(partes[0]) || 0;
                    pwmDir = parseInt(partes[1]) || 0;
                    acaoArduino = partes[5];
                    document.getElementById('stAcao').innerText = acaoArduino;
                    document.getElementById('stPwm').innerText = `${pwmEsq} / ${pwmDir}`;
                }
            }
        }
    }
}

// ============================================================================
// 3. FÍSICA DIFERENCIAL E CÁLCULO DE SENSORES (RAYCAST MATEMÁTICO)
// ============================================================================
const teclas = {};
window.addEventListener('keydown', e => teclas[e.key] = true);
window.addEventListener('keyup', e => teclas[e.key] = false);

function resetarPosicao() {
    roboGrupo.position.set(0, 0, 15);
    roboGrupo.rotation.y = 0;
}
resetarPosicao();

function calcularDistanciaSensor(anguloOffset, alcanceMax) {
    const anguloGlobal = roboGrupo.rotation.y + anguloOffset;
    const dirX = -Math.sin(anguloGlobal);
    const dirZ = -Math.cos(anguloGlobal);

    const origemX = roboGrupo.position.x + dirX * 9;
    const origemZ = roboGrupo.position.z + dirZ * 9;

    // Vetor até o inimigo
    const dx = inimigo.position.x - origemX;
    const dz = inimigo.position.z - origemZ;

    // Projeção no raio do sensor
    const proj = dx * dirX + dz * dirZ;
    if (proj > 0 && proj <= alcanceMax + 9) {
        const perpDistSq = (dx * dx + dz * dz) - (proj * proj);
        if (perpDistSq <= 9 * 9) { // Raio do cilindro inimigo = 9cm
            return Math.max(1, Math.round(proj - 9));
        }
    }
    return 999;
}

let ultimoEnvioSensores = 0;

function animate(tempo) {
    requestAnimationFrame(animate);

    // 1. Move o inimigo com as setas do teclado
    const velInimigo = 0.7;
    if (teclas['ArrowUp']) inimigo.position.z -= velInimigo;
    if (teclas['ArrowDown']) inimigo.position.z += velInimigo;
    if (teclas['ArrowLeft']) inimigo.position.x -= velInimigo;
    if (teclas['ArrowRight']) inimigo.position.x += velInimigo;

    // 2. Cinemática diferencial do Robô controlada pelo PWM que veio do Arduino Uno!
    const vEsq = (pwmEsq / 255.0) * 0.65;
    const vDir = (pwmDir / 255.0) * 0.65;
    const vLinear = (vEsq + vDir) / 2.0;
    const vAngular = (vEsq - vDir) / 14.0; // 14cm entre rodas

    roboGrupo.rotation.y -= vAngular;
    roboGrupo.position.x -= Math.sin(roboGrupo.rotation.y) * vLinear;
    roboGrupo.position.z -= Math.cos(roboGrupo.rotation.y) * vLinear;

    // 3. Mede sensores virtuais e verifica a borda branca do Dohyo
    const distFrente = calcularDistanciaSensor(0, 40);
    const distEsq = calcularDistanciaSensor(Math.PI / 5, 25);
    const distDir = calcularDistanciaSensor(-Math.PI / 5, 25);

    const raioAtual = Math.hypot(roboGrupo.position.x, roboGrupo.position.z);
    const pisouNaBorda = raioAtual >= (RAIO_BORDA_BRANCA - 6) ? 1 : 0;

    document.getElementById('stSensores').innerText = `${distFrente} / ${distEsq} / ${distDir} cm ${pisouNaBorda ? '(BORDA!)' : ''}`;

    // Envia leituras de volta para o Arduino a cada 80ms
    if (writer && tempo - ultimoEnvioSensores > 80) {
        ultimoEnvioSensores = tempo;
        enviarComando(`S,${distFrente},${distEsq},${distDir},${pisouNaBorda}`);
    }

    renderer.render(scene, camera);
}
animate(0);
</script>
</body>
</html>
